<!DOCTYPE html>
<html lang="en">

<head>
	<!-- Version tag (?v=...) on every script and stylesheet: bump it after changing
	     any of them, so browsers and GitHub Pages never mix old and new files. -->
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
	<title>My Pet Game</title>
	<link rel="stylesheet" href="engine/pet_style.css?v=20261029b" />
	<link rel="stylesheet" href="engine/scroll.css?v=20261029b">
</head>

<body>
	<canvas id="canvas"></canvas>

	<div id="ui">
		<div id="mode-menu">
			<button id="normal-btn">🧸 Drag</button>
			<button id="feed-btn">🍖 Feed</button>
			<button id="shower-btn">🧽 Shower</button>
			<button id="troll-btn">🧈 Troll</button>
			<button id="karaoke-btn">🎤 Karaoke</button>
			<button id="sleep-btn">😴 Sleep</button>
			<button id="doctor-btn">🩺 Doctor</button>
			<button id="playground-btn">🛝 Playground</button>
			<button id="garden-btn">🌱 Garden</button>
			<button id="confidence-btn">💪 Confidence</button>
		</div>
		<div id="hint" class="card small"></div>
	</div>

	<!-- game_config.js is PER-GAME and must load before any engine script -->
	<script src="game_config.js?v=20261029b"></script>
	<script src="engine/hd_canvas.js?v=20261029b"></script>
	<script src="engine/asset_path_fix.js?v=20261029b"></script>
	<script src="engine/pet_art.js?v=20261029b"></script>
	<script src="engine/mode_manger.js?v=20261029b"></script>
	<script src="outfit_config.js?v=20261029b"></script>
	<script src="engine/outfit_system_single_sprite.js?v=20261029b"></script>
	<script src="outfit_presets.js?v=20261029b"></script>
	<script src="engine/outfit_presets_ui.js?v=20261029b"></script>
	<!-- Ragdoll: the skeleton + physics (ported from Computer-pet) -->
	<script src="engine/ragdoll_config.js?v=20261029b"></script>
	<script src="engine/ragdoll.js?v=20261029b"></script>
	<script src="engine/pet_stats.js?v=20261029b"></script>
	<script src="engine/pet_modes.js?v=20261029b"></script>
	<script src="engine/canvas_fix.js?v=20261029b"></script>
	<script src="engine/ui_cleanup.js?v=20261029b"></script>
	<script src="engine/pet_toys.js?v=20261029b"></script>
</body>

</html>
