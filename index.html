<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
	<title>My Pet Game</title>
	<link rel="stylesheet" href="engine/pet_style.css" />
	<link rel="stylesheet" href="engine/scroll.css">
</head>

<body>
	<canvas id="canvas"></canvas>

	<div id="ui">
		<div id="mode-menu">
			<button id="normal-btn">🧸 Drag</button>
			<button id="feed-btn">🍖 Feed</button>
			<button id="shower-btn">🧽 Shower</button>
			<button id="troll-btn">🧈 Troll</button>
			<button id="karaoke-btn">🎤 Karaoke</button>
			<button id="sleep-btn">😴 Sleep</button>
			<button id="doctor-btn">🩺 Doctor</button>
			<button id="playground-btn">🛝 Playground</button>
			<button id="garden-btn">🌱 Garden</button>
		</div>
		<div id="hint" class="card small"></div>
	</div>

	<!-- game_config.js is PER-GAME and must load before any engine script -->
	<script src="game_config.js"></script>
	<script src="engine/hd_canvas.js"></script>
	<script src="engine/asset_path_fix.js"></script>
	<script src="engine/pet_art.js"></script>
	<script src="engine/mode_manger.js"></script>
	<script src="outfit_config.js"></script>
	<script src="engine/outfit_system_single_sprite.js"></script>
	<script src="outfit_presets.js"></script>
	<script src="engine/outfit_presets_ui.js"></script>
	<script src="engine/pet_stats.js"></script>
	<script src="engine/pet_modes.js"></script>
	<script src="engine/canvas_fix.js"></script>
	<script src="engine/ui_cleanup.js"></script>
	<script src="engine/pet_toys.js"></script>
</body>

</html>
